<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="https://use.typekit.net/dqu4ukv.css" />
    <link
      rel="stylesheet"

  <body>
    <header id="page-header">
      <div id="logo">
        <h1 id="logo-text">ClearlyPlan</h1>
      </div>
      <div id="greeting">
        <h1 id="greeting-text"></h1>
      </div>
      <div id="menu"></div>
    </header>
    <main>
      <section id="cal-section">
        <div id="cal-header">
          <button class="cal-nav" id="prev-month">&lt;</button>
          <h1 id="current-month"></h1>
          <button class="cal-nav" id="next-month">&gt;</button>
        </div>
        <div id="add-task-ui">
          <button class="open-form-btn" id="add-new-task-btn">
            <i class="fa-solid fa-plus"></i>&ensp; Add New Task
          </button>
          <button class="open-form-btn" id="edit-task-btn">
            <i class="fa-solid fa-pen"></i>&ensp; Edit Task
          </button>
        </div>
        <article id="cal-body"></article>
      </section>
      <section class="hidden" id="form-container">
        <form id="add-task-form">
          <button type="button" class="form-btn" id="cancel-task-btn">
            <i class="fa-solid fa-xmark"></i>&ensp; Cancel
          </button>
          <button type="button" class="form-btn" id="delete-task-btn">
            <i class="fa-solid fa-trash"></i>&ensp; Delete
          </button>
          <button type="button" class="form-btn" id="save-task-btn">
            <i class="fa-solid fa-check"></i>&ensp; Save
          </button>
          <dialog id="delete-task-popup">
            <p>Are you sure you want to delete this task?</p>
            <button class="form-btn" id="go-back-task-btn">
              <i class="fa-solid fa-arrow-left"></i>&ensp; Go Back
            </button>
            <button class="form-btn" id="confirm-delete-task-btn">
              <i class="fa-solid fa-trash"></i>&ensp; Delete
            </button>
          </dialog>

            <div class="task-field-div">
              <label for="task-title"
                >Title:<br /><input
                  type="text"
                  id="task-title"
                  class="task-field"
                  placeholder="Title" /></label
              ><br />
              <label for="task-desc"
                >Description:<br />
                <input
                  type="text"
                  id="task-desc"
                  class="task-field"
                  placeholder="Description"
                />
              </label>
            </div>
            <br />
            <p>Priority:</p>
            <div class="priority-list">
              <div class="priority-div" id="priority">
                <label for="low"
                  ><input
                    type="radio"
                    id="low"
                    name="priority"
                    class="priority-select"
                    value="low-lvl"
                    checked
                  /><i class="fa-solid fa-circle" id="green"></i>&ensp;
                  Low</label
                >
              </div>
              <div class="priority-div">
                <label for="medium"
                  ><input
                    type="radio"
                    id="medium"
                    name="priority"
                    class="priority-select"
                    value="medium-lvl"
                  /><i class="fa-solid fa-circle" id="yellow"></i>&ensp;
                  Medium</label
                >
              </div>
              <div class="priority-div">
                <label for="high"
                  ><input
                    type="radio"
                    id="high"
                    name="priority"
                    class="priority-select"
                    value="high-lvl"
                  /><i class="fa-solid fa-circle" id="red"></i>&ensp;
                  High</label
                >
              </div>
            </div>
          </fieldset>
          <fieldset class="form-section" id="date-and-time">
            <p>Set a date and time:</p>
            <div class="date-time-div" id="date-time-select">
              <label for="all-day">
                <input
                  type="radio"
                  id="all-day"
                  name="date-time-select"
                  class="selection"
                  value="all-day"
                  checked
                />All Day
              </label>
              <br />
              <label for="start-and-end"
                ><input
                  type="radio"
                  id="start-and-end"
                  name="date-time-select"
                  class="selection"
                />Start:<br /><input
                  type="datetime-local"
                  id="start"
                  name="start-and-end"
                  class="date-selection"
                  value=""
                /><br />
                <span id="end-title">End:</span><br />
                <input
                  type="datetime-local"
                  id="end"
                  name="start-and-end"
                  class="date-selection"
                  value=""
                />
              </label>
            </div>
          </fieldset>
