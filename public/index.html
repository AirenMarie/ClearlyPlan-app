<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="https://use.typekit.net/dqu4ukv.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <title>ClearlyPlan v1.0</title>
  </head>
  <body>
    <header id="page-header">
      <div id="logo">
        <h1 id="logo-text">ClearlyPlan</h1>
      </div>
      <div id="greeting">
        <h1 id="greeting-text"></h1>
      </div>
      <div id="menu"></div>
    </header>
    <main>
      <section id="cal-section">
        <div id="cal-header">
          <button class="cal-nav" id="prev-month">&lt;</button>
          <h1 id="current-month"></h1>
          <button class="cal-nav" id="next-month">&gt;</button>
        </div>
        <article id="cal-body"></article>
      </section>
      <section id="quote-section">
        <article id="quote-text"></article>
      </section>
    </main>
    <footer id="page-footer"></footer>
    <script src="/js/index.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
